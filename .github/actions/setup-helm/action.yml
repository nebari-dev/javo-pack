name: Set up Helm
description: >-
  Helm v4.3.1, the linux/amd64 release archive from get.helm.sh, checked
  against the sha256 published next to it (helm-v4.3.1-linux-amd64.tar.gz.sha256sum).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HELM_VERSION: v4.3.1
        HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      run: |
        set -euo pipefail
        curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
        echo "$HELM_SHA256  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/helm"
        tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
        echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
