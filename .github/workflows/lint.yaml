name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-emulation:
    name: No emulation in workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds cross-compile on the runner's own platform; emulated builds
      # are slow and never allowed in any workflow.
      - run: |
          if git grep -n -i -E 'q[e]mu|b[i]nfmt' -- '*.yml' '*.yaml'; then
            echo "::error::emulated build setup found in a workflow"
            exit 1
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # oci://quay.io/nebari/charts/javo is public.
      - name: Fetch the javo chart
        run: helm dependency build .

      - name: Helm lint
        run: helm lint . -n javo -f examples/nebari-values.yaml

      - name: Helm template (NebariApp enabled)
        run: helm template javo-pack . -n javo -f examples/nebari-values.yaml

      - name: Helm template (standalone, NebariApp disabled)
        run: helm template javo-pack . -n javo --set nebariapp.enabled=false

      # What one domain derives, explicit values winning, and values that
      # would point Javo at a client or Secret the operator does not create
      # being refused.
      - name: Render checks
        run: dev/check-render.sh
