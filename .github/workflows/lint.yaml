name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-emulation:
    name: No emulation in workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds cross-compile on the runner's own platform; emulated builds
      # are slow and never allowed in any workflow.
      - run: |
          if git grep -n -i -E 'q[e]mu|b[i]nfmt' -- '*.yml' '*.yaml'; then
            echo "::error::emulated build setup found in a workflow"
            exit 1
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      # cosign v3.0.6, the release this installer version pins by sha256.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # oci://quay.io/nebari/charts/javo is public. By the digest Chart.yaml
      # names, after cosign checks the javo release workflow signed it.
      - name: Fetch and verify the javo chart
        run: dev/fetch-javo-chart.sh

      - name: Helm lint
        run: helm lint . -n javo -f examples/nebari-values.yaml

      # Javo refuses to render without ValidatingAdmissionPolicy, which every
      # supported cluster (Kubernetes 1.30+) serves; helm template sees no
      # cluster, so it is told.
      - name: Helm template (NebariApp enabled)
        run: helm template javo-pack . -n javo -f examples/nebari-values.yaml --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy

      - name: Helm template (standalone, NebariApp disabled)
        run: helm template javo-pack . -n javo --set nebariapp.enabled=false --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy

      # What one domain derives, explicit values winning, and values that
      # would point Javo at a client or Secret the operator does not create
      # being refused.
      - name: Render checks
        run: dev/check-render.sh
