name: Release Chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # oci://quay.io/nebari/charts/javo is public.
      - name: Fetch the javo chart
        run: helm dependency build .

      - name: Get chart version
        id: chart
        run: |
          echo "version=$(grep '^version:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^name:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
        run: |
          if gh release view "$TAG" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        if: steps.check.outputs.exists == 'false'
        run: helm package .

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes ./*.tgz

      - name: Update Helm repo index
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          GH_PAGES_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Keep earlier releases in the index; bootstrap the branch on the first release.
          if git ls-remote --exit-code --heads "${GH_PAGES_URL}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${GH_PAGES_URL}" gh-pages
          else
            mkdir -p gh-pages
            git -C gh-pages init -b gh-pages
            git -C gh-pages remote add origin "${GH_PAGES_URL}"
          fi

          cp ./*.tgz gh-pages/
          cd gh-pages
          if [ -f index.yaml ]; then
            helm repo index . --url "${REPO_URL}" --merge index.yaml
          else
            helm repo index . --url "${REPO_URL}"
          fi

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add index.yaml ./*.tgz
          git commit -m "Release ${TAG}"
          git push origin gh-pages
