name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pack on a kind cluster with the Nebari stack (MetalLB, Envoy Gateway,
  # cert-manager, Keycloak, nebari-operator), then a Keycloak sign-in to Javo
  # through the gateway and an app opened on the apps host (dev/verify-signin.sh).
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      # cosign v3.0.6, the release this installer version pins by sha256.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # oci://quay.io/nebari/charts/javo is public. By the digest Chart.yaml
      # names, after cosign checks the javo release workflow signed it.
      - name: Fetch and verify the javo chart
        run: dev/fetch-javo-chart.sh

      # A fresh random password for the Keycloak realm user, which the
      # cluster setup sets and verify-signin.sh signs in with.
      - name: Keycloak user password
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "KC_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Create the cluster and the Nebari stack
        run: make -C dev cluster

      - name: Install the pack
        run: make -C dev up

      - name: Sign in through the gateway and open an app
        run: make -C dev verify

      - name: Debug info on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/dev/.cache/kubeconfig
        run: |
          kubectl get nebariapp -A -o wide || true
          kubectl describe nebariapp -n javo || true
          kubectl get httproute,securitypolicy -A || true
          kubectl get pods -A || true
          kubectl logs -n javo deploy/javo --all-containers --tail=200 || true
          kubectl logs -n nebari-operator-system deploy/nebari-operator-controller-manager --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
