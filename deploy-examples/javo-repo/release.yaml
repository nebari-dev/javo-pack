# Draft for nebari-dev/javo: .github/workflows/release.yaml
#
# On a tag vX.Y.Z it publishes what this pack depends on:
#   image  ghcr.io/nebari-dev/javo:X.Y.Z   (linux/amd64 and linux/arm64)
#   chart  oci://ghcr.io/nebari-dev/charts/javo, version X.Y.Z, whose default
#          image is that tag pinned by digest
#
# The chart's version and appVersion are set from the tag at packaging time,
# so Chart.yaml in the repository needs no edit per release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nebari-dev/javo
      CHARTS: oci://ghcr.io/nebari-dev/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          chart=deploy/helm/javo
          # Default image of the published chart: this release, by digest.
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$VERSION\" | .image.digest = \"$DIGEST\"" "$chart/values.yaml"
          helm lint "$chart"
          helm package "$chart" --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP"
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP/javo-$VERSION.tgz" "$CHARTS"
