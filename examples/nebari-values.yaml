# Values for a NIC cluster: its domain. Javo is served at javo.<domain> and
# javo-apps.<domain> (DNS for both, or a wildcard), and signs in with
# https://keycloak.<domain>/realms/nebari. NIC's realm admin becomes a Javo
# admin; list more Keycloak usernames under nebariapp.auth.keycloakGroups.
global:
  domain: example.com

# With nebi-pack installed (release nebi-pack, namespace nebi):
# javo:
#   config:
#     nebi:
#       enabled: true
